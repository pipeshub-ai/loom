[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomsdk"
version = "0.1.0"
description = "Library-first durable execution SDK for AI-powered workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "PipesHub AI", email = "dev@pipeshub.com"},
]
keywords = [
    "workflow",
    "automation",
    "orchestration",
    "agents",
    "ai",
    "durable-execution",
    "langchain",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
# Storage backends
mongo = ["motor>=3.0"]
postgres = ["asyncpg>=0.29"]
s3 = ["aioboto3>=13.0"]
azure = ["azure-storage-blob>=12.0"]
gcs = ["google-cloud-storage>=2.0"]

# Google Workspace service-account auth (Gmail/Calendar toolsets).
# The refresh-token and access-token flows need nothing but httpx.
google = ["google-auth>=2.0"]

# Inbound identity — verifying a bearer token presented to the MCP/HTTP
# surfaces. Outbound credential storage (below) is a separate extra: a
# deployment that only ever runs `loom mcp` with no auth needs neither.
identity = ["pyjwt[crypto]>=2.9"]

# Outbound credential storage — encrypted-file and OS-keyring backed
# `CredentialStore` implementations. `MemoryCredentialStore` needs neither
# and works with the core install alone.
credentials = ["keyring>=25", "cryptography>=43"]

# Web search. Exa and Tavily are plain HTTP APIs and need nothing extra;
# DuckDuckGo publishes no web-search API, so that toolset rides on `ddgs`,
# which parses search result pages. Optional for exactly that reason — it is a
# different reliability contract from the other two, and nobody should acquire
# it by installing the core package.
duckduckgo = ["ddgs>=9.0"]

# Driving a page — both halves. `BrowserProbe` uses this to *look* at a page at
# authoring time, and `LocalBrowserProvider` to act on one at run time; they
# share the single driver deliberately, so phase 13 added no new dependency.
# Needs `playwright install chromium` after pip, since the browser is not a
# Python package.
browser = ["playwright>=1.40"]

# Anti-detection, opt-in and separate. `patchright` is an Apache-2.0 drop-in
# fork of Playwright; `LocalBrowserProvider(engine="patchright")` swaps it in.
# Not folded into [browser] because evasion is a posture a host adopts
# deliberately — LOOM ships none of its own and treats bot detection as the
# provider's problem.
stealth = ["patchright>=1.40"]

# Reading a PDF or a Word document — `transform.parse_document`. Optional
# because plain text, Markdown, CSV and JSON need nothing, and a workflow that
# never touches a binary document should not acquire two parsers to install
# the core package.
documents = ["pypdf>=5.0", "python-docx>=1.1"]

# Model providers
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.60"]
gemini = ["google-genai>=1.0"]

# Agent framework backends
langchain = [
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "langchain-community>=0.3",
]
agno = ["agno>=2.0"]
pydantic-ai = ["pydantic-ai>=2.0"]

# API server
api = [
    # Floor at 0.135, not 0.115: earlier releases cap starlette below 1.0, and
    # anything else in the environment that pulls a newer starlette then breaks
    # *FastAPI itself* — `FastAPI()` raises on `Router(on_startup=…)` before any
    # of our code runs. That reads as "the HTTP surface is broken" rather than
    # as a dependency conflict, and it takes the whole HTTP test suite with it.
    "fastapi>=0.135",
    "uvicorn[standard]>=0.30",
]

# Nicer CLI output, and the interactive session `loom` opens with no
# subcommand. Without either, every command still works in plain text and
# `loom` prints help — the session refuses with the install line rather than
# degrading into a worse version of itself, because a line editor without line
# editing is not a smaller feature, it is a broken one.
cli = ["rich>=13.0", "prompt_toolkit>=3.0"]

# MCP server (`loom mcp`) — the official SDK's high-level `MCPServer` API.
#
# Floor measured against the suite, not guessed. mcp 2.0 removed
# `mcp.server.fastmcp` outright — `FastMCP` became `MCPServer` in
# `mcp.server.mcpserver`, and `host`/`port`/`transport_security` moved from the
# constructor to the run call. There is no release that answers to both shapes,
# so LOOM speaks 2.x and only 2.x.
#
# `<3` is the lesson of the bump that produced this line, not caution for its
# own sake. An open upper bound is what let 2.0 reach `pip install loomsdk[mcp]`
# as a silent breaking change, and phases/phase-9-mcp-server.md predicted
# exactly that and prescribed exactly this ("Pin `mcp>=2.0,<3.0`"). Every 2.x
# release is still taken; 3.0 will be a port, and a port should be a decision
# somebody makes rather than something a fresh install discovers.
#
# The previous `>=1.2` was wrong at both ends and quietly so. 2.0 is the
# current stable release, so it resolved to a version LOOM could not import;
# and nothing older than 1.14 ever worked either — 1.13.1 fails 12 of the MCP
# tests with 31 errors, because mcp's own tool registration calls `issubclass()`
# on a union annotation. A symbol probe finds neither: every import LOOM makes
# resolves as far back as 1.12.3, which then registers no tools at all.
mcp = ["mcp>=2.0,<3"]

# Terminal UI (`loom ui`)
tui = ["loomsdk[cli]", "textual>=0.80"]

# Conformance kits — `loom.testing.conformance`, for proving a third-party
# EventLog/Checkpoints adapter correct. The kits ship in the main wheel so they
# assert *this* version's contract; a separately versioned package could be
# installed against a different LOOM and would then silently pass an adapter
# that is wrong. Only the test runner is optional.
testing = ["pytest>=8.0", "pytest-asyncio>=0.24"]

# Development
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.0",
    "httpx>=0.27",
    # The HTTP surface ships in-tree, so its tests should run by default rather
    # than silently skipping on a machine without the api extra. Same floor as
    # the api extra, and for the same reason.
    "fastapi>=0.135",
    # Same reasoning: the credential-store conformance suite covers the
    # encrypted-file and keyring-backed implementations, not only Memory.
    "keyring>=25",
    "cryptography>=43",
    # Property-based tests for the scope-narrowing invariant identity relies on.
    "hypothesis>=6.100",
    # JWKS/JWT verification tests for the MCP/HTTP token verifiers.
    "pyjwt[crypto]>=2.9",
]

# Install everything
all = [
    "loomsdk[mongo,postgres,s3,azure,gcs,google,identity,credentials,anthropic,openai,gemini,langchain,duckduckgo,browser,stealth,documents,api,cli,tui,mcp,testing]"
]

[project.urls]
Homepage = "https://github.com/pipeshub-ai/workflow"
Repository = "https://github.com/pipeshub-ai/workflow"
Documentation = "https://github.com/pipeshub-ai/workflow/tree/main/docs"
Changelog = "https://github.com/pipeshub-ai/workflow/blob/main/CHANGELOG.md"
Issues = "https://github.com/pipeshub-ai/workflow/issues"

[project.scripts]
loom = "loom.cli:main"
loomsdk = "loom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loom = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: spawns a real process (signal handling); deselect with -m 'not slow'",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

# Run in an environment installed as `pip install -e ".[dev]"` — deliberately
# *not* `[all]`.
#
# `python_version` is the floor `requires-python` and the classifiers promise,
# and checking against the oldest supported version is the whole point: it is
# what catches a 3.12-only stdlib call. It is not negotiable to make a
# dependency happy.
#
# The optional integration SDKs pull numpy transitively (langchain-community,
# openai, agno, pydantic-ai), and numpy's stubs use PEP 695 `type` statements —
# a *syntax* error below 3.12. mypy therefore failed to parse them and stopped
# with "errors prevented further checking", never type-checking loom at all: a
# clean tree reported 19 failures no change could fix, which is how a gate stops
# being read. No per-module setting avoids this, because `follow_imports` and
# `ignore_errors` are both ignored for stub files and the failure happens during
# parsing regardless.
#
# The resolution is that the type-check environment is not the test environment.
# None of those SDKs is needed to check loom — every one is imported lazily
# inside a function and declared below as tolerable-when-absent — so `[dev]`,
# which pulls none of them, is the environment this check is *for*. The full
# suite still needs `[all]`; that is a separate environment with a separate job.
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["loom"]

# Optional third-party SDKs, each behind an extra and imported lazily inside a
# function. Absent is the normal case, not a defect in this code. Present, they
# are still type-checked normally — `ignore_missing_imports` only applies when
# mypy cannot find the module.
#
# Core and dev dependencies are deliberately absent from this list: pydantic,
# httpx and fastapi missing *is* a real problem, and silencing it would hide it.
[[tool.mypy.overrides]]
module = [
    "agents.*",
    "agno.*",
    "aioboto3.*",
    "anthropic.*",
    "asyncpg.*",
    "autogen_agentchat.*",
    "azure.*",
    "boto3.*",
    "botocore.*",
    # pymongo ships `bson` as a separate top-level package; both arrive with the
    # `[mongo]` extra.
    "bson.*",
    "crewai.*",
    "ddgs.*",
    # Document extraction nodes; optional readers, imported inside a function.
    "docx.*",
    "pypdf.*",
    # `python-docx` imports as `docx`. Both arrive with the `[documents]` extra.
    "docx.*",
    # The bare namespace as well as the packages under it — `google` alone is
    # what an `import google.auth` resolves first, and a `google.*` pattern does
    # not match it.
    "google",
    "google.auth.*",
    "google.cloud.*",
    "google.genai.*",
    "google.oauth2.*",
    "langchain.*",
    "langchain_anthropic.*",
    "langchain_community.*",
    "langchain_core.*",
    "langgraph.*",
    "mcp.*",
    "motor.*",
    "openai.*",
    "opentelemetry.*",
    # The browser probe's driver, behind the `browser` extra and imported
    # inside a function with an ImportError guard — absent is the normal case.
    "playwright.*",
    "pydantic_ai.*",
    "pymongo.*",
    "pypdf.*",
    "redis.*",
    # The interactive session's line editor, from `[cli]`. Same standing as
    # `rich` and `textual`: optional, imported inside a function, and the
    # module deciding whether a session is possible checks for it by spec
    # rather than by importing it.
    "prompt_toolkit.*",
    "rich.*",
    "textual.*",
    "uvicorn.*",
]
ignore_missing_imports = true

# Local `loom mcp` / `loom run <name>` without --module. Cookbook examples that
# talk to a real service (Jira, Gmail) stay off this list so a bare server
# does not fail at import for missing credentials.
[tool.loom]
modules = ["examples/cookbook/01_sequential.py", "flows/who_won_ipl_2.py"]
