[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-builder"
version = "0.11.0"
description = "Library-first durable execution SDK for AI-powered workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "PipesHub AI", email = "dev@pipeshub.com"},
]
keywords = [
    "workflow",
    "automation",
    "orchestration",
    "agents",
    "ai",
    "durable-execution",
    "langchain",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
# Storage backends
mongo = ["motor>=3.0"]
postgres = ["asyncpg>=0.29"]
s3 = ["aioboto3>=13.0"]

# Google Workspace service-account auth (Gmail/Calendar toolsets).
# The refresh-token and access-token flows need nothing but httpx.
google = ["google-auth>=2.0"]

# Model providers
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.60"]
gemini = ["google-genai>=1.0"]

# Agent framework backends
langchain = [
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "langchain-community>=0.3",
]
agno = ["agno>=2.0"]
pydantic-ai = ["pydantic-ai>=2.0"]

# API server
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

# Nicer CLI output. Without it every command still works, in plain text.
cli = ["rich>=13.0"]

# MCP server (`loom mcp`) — the official SDK's high-level FastMCP API.
mcp = ["mcp>=1.2"]

# Terminal UI (`loom ui`)
tui = ["workflow-builder[cli]", "textual>=0.80"]

# Development
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.0",
    "httpx>=0.27",
    # The HTTP surface ships in-tree, so its tests should run by default rather
    # than silently skipping on a machine without the api extra.
    "fastapi>=0.115",
]

# Install everything
all = [
    "workflow-builder[mongo,postgres,s3,google,anthropic,openai,gemini,langchain,api,cli,tui,mcp]"
]

[project.urls]
Homepage = "https://github.com/pipeshub-ai/workflow"
Repository = "https://github.com/pipeshub-ai/workflow"
Documentation = "https://github.com/pipeshub-ai/workflow/tree/main/docs"
Changelog = "https://github.com/pipeshub-ai/workflow/blob/main/CHANGELOG.md"
Issues = "https://github.com/pipeshub-ai/workflow/issues"

[project.scripts]
loom = "workflow_builder.cli:main"
workflow-builder = "workflow_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workflow_builder = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["workflow_builder"]
