name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts examples

  seam-catalog:
    # The drift alarm. A Protocol that gains a method fails here, before it
    # reaches review as a page nobody re-read.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/gen_seam_catalog.py --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Blocking, and through the wrapper rather than mypy directly.
      #
      # `mypy || true` let 42 real errors across three toolsets merge green.
      # Worse, running mypy by hand in an `[all]` environment stops on a numpy
      # stub with "errors prevented further checking" — four errors, none of
      # them yours, and nothing type-checked. The wrapper asserts the
      # "checked N source files" summary and exits 2 when that is missing, so
      # a gate that did not run is distinguishable from one that failed.
      - run: python scripts/typecheck.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q --cov=loom --cov-report=term-missing

  # The store parity matrix. Separate from `test` because it needs real servers:
  # Mongo and Postgres claim the same four protocols as Memory and SQLite, and
  # until this job existed nothing drove them through it. The first run against
  # real servers found five divergences, one of which meant MongoStore could
  # hold exactly one run without an idempotency key.
  #
  # A backend that cannot be reached is SKIPPED and named, never dropped — so a
  # service failing to start here reads differently from a passing run.
  store-parity:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      LOOM_TEST_MONGO: mongodb://localhost:27017
      LOOM_TEST_POSTGRES: postgresql://postgres:loom@localhost:5432/loom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,mongo,postgres]"
      # -rs prints the skip reasons: "2 passed, 2 skipped" with no reason is
      # how a matrix silently stops covering half of what it claims.
      - run: pytest tests/conformance tests/test_store_conformance.py -q -rs --tb=short
      # A store reachable but skipped means the job is not doing its job.
      - name: every backend actually ran
        run: |
          pytest tests/test_store_conformance.py -q -rs --tb=no 2>&1 | tee /tmp/parity.txt
          if grep -qE "SKIPPED.*(mongo|postgres):" /tmp/parity.txt; then
            echo "::error::a backend was skipped in the parity job"; exit 1
          fi

  # Executes every example in the README and docs/. Separate from `test`
  # because it needs the optional extras, a database, and several minutes —
  # and because it is the only check that catches a *wrong* API. A missing
  # import fails the linter and bad syntax fails the compiler, but
  # `Retry(backoff=2.0)` resolves every name, compiles, and raises TypeError
  # for the first reader who follows the page.
  docs-examples:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workflows
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Everything an example might import. Without the extras the run still
      # passes, but by skipping rather than checking — which is the failure
      # mode this job exists to remove.
      - run: pip install -e ".[dev,all]"

      - name: Run every documented example
        env:
          MONGO_URI: mongodb://localhost:27017
          POSTGRES_DSN: postgresql://postgres:postgres@localhost/workflows
          # Optional. Absent on a fork's pull request, where examples that need
          # a model are reported as skipped rather than failing the build.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/docs_examples.py --timeout 240

  # The same check, for the examples that live as files rather than as code
  # blocks. `docs-examples` reads README.md and docs/**/*.md and nothing else,
  # so everything under examples/ — the cookbook, and the ten reference
  # workflows — was covered by no gate at all: five of the ten stopped
  # importing when `Retry` renamed a field, while tests/test_phase8.py went on
  # reporting 104 passing tests over them, because every one was a substring
  # search against the file's text.
  #
  # Separate from `docs-examples` because the two run their subjects
  # differently — a documented block is extracted into a temporary directory,
  # a file on disk is run where it lives — and because either failing should
  # name which kind broke.
  examples:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Everything an example might import. Without the extras the run still
      # passes, but by skipping rather than checking.
      - run: pip install -e ".[dev,all]"

      - name: Run every example under examples/
        env:
          # Optional, as above: an example needing a model is reported as
          # skipped on a fork's pull request rather than failing the build.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/run_examples.py --timeout 400
